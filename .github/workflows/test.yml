name: test

# Every push and pull request (Dependabot's included): lint, types, the dependency audit
# and the tests on Linux (under Xvfb, so the window tests run too) and Windows. The
# release build lives in build.yml. Actions are pinned to commit hashes, as there.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

      - name: Dependency audit
        # the pinned build set against the vulnerability databases; a finding fails the job
        run: python -m pip_audit --require-hashes -r requirements-build.txt

  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install -r requirements-dev.txt

      - name: Tests under Xvfb
        timeout-minutes: 15
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python -X utf8 -m unittest discover tests

  tests-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        timeout-minutes: 15
        run: python -X utf8 -m unittest discover tests
