name: build

# Actions are pinned to commit hashes (the tag in the comment is what the hash was when
# pinned): a moved or hijacked tag cannot change what runs here. Python packages come from
# requirements-build.txt with exact versions and hashes (--require-hashes).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # ruff over everything, mypy over the pure modules (pyproject.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy

  windows:
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        run: python -X utf8 -m unittest discover tests

      - name: Build exe
        # The console helper first (the Claude Code hook and the journal commands, a folder:
        # it starts three times faster than one file), then the app that carries it.
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --noupx --name daykeeper-cli --icon assets/icon.ico --exclude-module tkinter --exclude-module cryptography --exclude-module argon2 cli_main.py
          if ($LASTEXITCODE) { exit 1 }
          Set-Content -NoNewline -Encoding ascii dist/daykeeper-cli/build-id.txt "${{ github.sha }}"
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --noupx --name Daykeeper --icon assets/icon.ico --add-data "assets;assets" --add-data "dist/daykeeper-cli;daykeeper-cli" main.py
          if ($LASTEXITCODE) { exit 1 }
          # the same app as a folder: it opens its window in well under a second, where the
          # one-file exe unpacks itself on every start (about two seconds, more with antivirus)
          python -m PyInstaller --noconfirm --clean --onedir --noconsole --noupx --name Daykeeper --icon assets/icon.ico --add-data "assets;assets" --add-data "dist/daykeeper-cli;daykeeper-cli" --distpath dist/Daykeeper-win64 --workpath build/Daykeeper-win64 main.py
          if ($LASTEXITCODE) { exit 1 }
          python -c "import shutil; shutil.make_archive('dist/Daykeeper-win64', 'zip', 'dist/Daykeeper-win64')"
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-windows
          path: |
            dist/Daykeeper.exe
            dist/Daykeeper-win64.zip

  macos:
    needs: lint
    # Apple Silicon build (GitHub's current macOS runners are arm64). The app is not
    # signed: the first start needs "Open Anyway" in Privacy & Security, or the quarantine
    # flag removed (see README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Tests
        # a test that hangs stops here with the stacks printed, not at the job's six hours
        timeout-minutes: 15
        run: python -X faulthandler -c "import faulthandler, sys, unittest; faulthandler.dump_traceback_later(600, exit=True); sys.argv = ['unittest', 'discover', '-v', 'tests']; unittest.main(module=None)"

      - name: Build app bundle
        # PyInstaller writes 0.0.0 into Info.plist: the version comes from the package, the
        # minimum system is the macOS the bundle is built and tested on; the ad-hoc signature
        # is renewed after the plist edit (the edit breaks the one PyInstaller made)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --noupx --name Daykeeper \
            --icon assets/icon.icns --add-data "assets:assets" \
            --osx-bundle-identifier ru.achadin.daykeeper main.py
          VERSION=$(python -c "import daykeeper; print(daykeeper.__version__)")
          PLIST=dist/Daykeeper.app/Contents/Info.plist
          plutil -replace CFBundleShortVersionString -string "${VERSION%%-*}" "$PLIST"  # macOS takes digits and dots only: 1.1.2-beta.1 -> 1.1.2
          plutil -replace CFBundleVersion -string "${VERSION%%-*}" "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "14.0" "$PLIST"
          codesign --force --deep --sign - dist/Daykeeper.app
          ditto -c -k --sequesterRsrc --keepParent dist/Daykeeper.app dist/Daykeeper-macos.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Daykeeper-macos
          path: dist/Daykeeper-macos.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # the provenance attestation is signed with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          mkdir out
          cp artifacts/Daykeeper-windows/Daykeeper.exe artifacts/Daykeeper-windows/Daykeeper-win64.zip artifacts/Daykeeper-macos/Daykeeper-macos.zip out/
          cd out
          sha256sum Daykeeper.exe Daykeeper-win64.zip Daykeeper-macos.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Provenance
        # a signed statement of which workflow run, commit and inputs built each file; check a
        # download with `gh attestation verify Daykeeper.exe --owner <owner>`. The binaries
        # themselves stay unsigned: a code-signing certificate is not in hand (see README).
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            out/Daykeeper.exe
            out/Daykeeper-win64.zip
            out/Daykeeper-macos.zip

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            out/Daykeeper.exe
            out/Daykeeper-win64.zip
            out/Daykeeper-macos.zip
            out/SHA256SUMS.txt
          body_path: CHANGELOG.md
          generate_release_notes: true
          # a tag with a suffix (v1.2.0-beta.1, -rc.1) is a pre-release: marked so on GitHub and
          # never shown as the latest release
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
